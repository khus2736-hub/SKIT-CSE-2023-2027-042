spring:
  application:
    name: ems
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/amagen_ems}
  mvc:
    format:
      date: yyyy-MM-dd

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQURlZmF1bHREZXZTZWNyZXRLZXlGb3JKXRUZXN0aW5nT25seQ==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@amagen.com}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
  seed-sample-data: ${APP_SEED_SAMPLE_DATA:false}
  timezone: Asia/Kolkata
  attendance:
    late-after: "10:00"
    half-day-hours: 4
